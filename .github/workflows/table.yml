name: table

# Pull requests and pushes: validate the review files only (no write access).
# Push to main: regenerate TABLE.md and docs/reviews.json (the data of the docs/ web page) and commit them, so no
# agent ever edits either file and they never conflict.
on:
  pull_request:
    paths:
      - "reviews/**"
      - "build_table.py"
      - "scripts/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "reviews/**"
      - "build_table.py"
      - "scripts/**"
      - "tests/**"
  # A push whose message has [skip ci] never starts this workflow, so reviews pushed that way would stay out of
  # TABLE.md and the web page. The schedule catches them up; it commits nothing when nothing changed.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: table-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I build_table.py --check
      - run: python3 -I -m unittest discover -s tests

  render:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - run: python3 -I build_table.py
      # How much of Leonida's open queue has a review. Scheduled and manual runs only: listing the open pull requests
      # is about 45 read-only API calls, too many for every push. A failure here never blocks the table.
      - name: Queue coverage
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/coverage.py
      - name: Commit TABLE.md and docs/reviews.json when they changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TABLE.md docs/reviews.json
          if [ -f docs/coverage.json ]; then git add docs/coverage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'table: regenerate [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
